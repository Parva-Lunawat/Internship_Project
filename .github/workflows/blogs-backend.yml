name: Blogs Backend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Tasks/Week_6/zeon-blog/blogs-backend/**"
      - ".github/workflows/blogs-backend.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "Tasks/Week_6/zeon-blog/blogs-backend/**"
      - ".github/workflows/blogs-backend.yml"

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zeon_blog_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Tasks/Week_6/zeon-blog/blogs-backend

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: zeon_blog_test
      JWT_SECRET: ci-test-secret
      CORS_ORIGIN: http://example.test
      OBS_FORWARD_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tasks/Week_6/zeon-blog/blogs-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:vitest

      - name: Build
        run: npm run build
