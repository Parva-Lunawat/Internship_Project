name: Zeon Backend Tests

on:
  pull_request:
    paths:
      - 'Tasks/Week_6/zeon-blog/blogs-backend/**'
      - '.github/workflows/zeon-backend-test.yml'

env:
  MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
  JWT_SECRET: ci-jwt-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Tasks/Week_6/zeon-blog/blogs-backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: zeon_blog_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ env.MYSQL_ROOT_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
      DB_NAME: zeon_blog_ci
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${{ env.JWT_SECRET }}
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tasks/Week_6/zeon-blog/blogs-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test:vitest
