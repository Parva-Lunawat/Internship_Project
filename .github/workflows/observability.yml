name: Observability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Tasks/Week_6/zeon-blog/zeon-observability/**"
      - ".github/workflows/observability.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "Tasks/Week_6/zeon-blog/zeon-observability/**"
      - ".github/workflows/observability.yml"

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zeon_observability_test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: Tasks/Week_6/zeon-blog/zeon-observability

    env:
      NODE_ENV: test
      OBS_DB_HOST: 127.0.0.1
      OBS_DB_PORT: 3306
      OBS_DB_USERNAME: root
      OBS_DB_PASSWORD: root
      OBS_DB_NAME: zeon_observability_test
      OBS_DB_SYNCHRONIZE: "1"
      OBS_JWT_SECRET: ci-test-service-secret
      OBS_INGEST_JWT_SECRET: ci-test-service-secret
      OBS_INGEST_JWT_ISSUER: blogs-backend
      OBS_INGEST_JWT_AUDIENCE: zeon-observability
      JWT_SECRET: ci-test-admin-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tasks/Week_6/zeon-blog/zeon-observability/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm run test:backend

      - name: Build backend
        run: npm run build:backend

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Tasks/Week_6/zeon-blog/zeon-observability

    env:
      NEXT_PUBLIC_MAIN_API_BASE_URL: http://example.test
      NEXT_PUBLIC_OBS_API_BASE_URL: http://example.test
      NEXT_PUBLIC_OBS_POLL_MS: 1800000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tasks/Week_6/zeon-blog/zeon-observability/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build:frontend
